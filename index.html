<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Weight Calculator</title>

    <link rel="stylesheet" href="style.css">

    <!-- OCR Library -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<div class="container">

    <h1>Smart Weight Calculator</h1>

    <p class="subtitle">
        Take a photo and calculate automatically
    </p>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        capture="environment"
    >

    <button id="readButton">
        📷 Read Image
    </button>

    <div id="loading"></div>

    <h2>Detected Text</h2>

    <textarea
        id="ocrText"
        placeholder="Detected numbers will appear here..."
    ></textarea>

    <button id="calculateButton">
        Calculate
    </button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
